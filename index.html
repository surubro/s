        /* =========================================
           1. MODERN BASE STYLES
           ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1, h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 2rem 0 1rem 0;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 0.5rem;
        }

        /* =========================================
           2. SEARCH BAR UI
           ========================================= */
        .search-container {
            position: sticky;
            top: 1rem;
            z-index: 100;
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            color: #ffffff;
            outline: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        /* =========================================
           3. BUTTON & CARD GRID LAYOUT
           ========================================= */
        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .card-link {
            text-decoration: none;
        }

        .card-button {
            width: 100%;
            height: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s ease;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .card-button:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
            border-color: #38bdf8;
        }

        /* Hide elements when filtered out */
        .card-link.hidden {
            display: none !important;
        }
    </style>

    <!-- Simple Search Script for Beginners -->
    <script>
        function filterLinks() {
            // Get user input and convert to lowercase
            const input = document.getElementById('searchInput').value.toLowerCase();
            // Select all link containers
            const links = document.querySelectorAll('.card-link');

            links.forEach(link => {
                // Get the text inside the button
                const buttonText = link.textContent.toLowerCase();
                
                // Show link if search term matches button text, otherwise hide
                if (buttonText.includes(input)) {
                    link.classList.remove('hidden');
                } else {
                    link.classList.add('hidden');
                }
            });
        }
    </script>
